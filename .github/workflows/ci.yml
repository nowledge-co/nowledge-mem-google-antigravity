name: Continuous Integration

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  ci:
    name: Build, Lint & Integration Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          python-version: '3.14'

      - name: Install dependencies
        run: |
          npm install
          uv sync

      - name: Run linter & static analysis
        run: |
          make lint
          uv run pre-commit run --all-files

      - name: Run unit test validation suite
        run: npm run validate

      - name: Pull Mem server container and run integration tests
        run: |
          docker pull docker.io/nowledgelabs/mem:latest
          make test-integration

      - name: Verify release packaging bundle
        run: npm run package:release
