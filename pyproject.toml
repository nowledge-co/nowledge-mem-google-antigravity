[project]
name = "nowledge-mem-google-antigravity-tests"
version = "0.1.3"
description = "Integration test suite for nowledge-mem Google Antigravity plugin"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
    "nmem-cli",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
    "nmem-cli",
    "ruff>=0.3.0",
    "ty",
    "pre-commit>=3.6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # Line too long
    "SIM105", # try-except-pass
    "B904",   # raise ... from err
    "SIM102", # nested if
    "SIM108", # ternary operator
    "UP022",  # capture_output
    "F841",   # unused variable
]
